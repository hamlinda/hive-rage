[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-rage"
version = "0.1.0"
description = "Local Ubuntu service that indexes a hive folder and answers Ollama-backed queries."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "hamlinda", email = "hamlinda@gmail.com" }
]
dependencies = [
  "pypdf>=5.4.0",
  "python-docx>=1.1.2",
]

[project.scripts]
hive-rage = "hive_rage.cli:main"

[tool.setuptools]
packages = ["hive_rage"]
